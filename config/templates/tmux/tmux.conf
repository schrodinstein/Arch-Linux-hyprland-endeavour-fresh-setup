# Terminal capabilities
set -g default-terminal "tmux-256color"
set -s terminal-features[100] "xterm-kitty:RGB:clipboard:extkeys:focus:hyperlinks:osc7:sync"
set -s extended-keys on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -ga update-environment " WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS"

# Predictable sessions and responsive interaction
set -g mouse on
set -g history-limit 100000
set -s escape-time 10
set -g display-time 1200
set -g repeat-time 400
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g automatic-rename on
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "tmux: #S / #W"

# Compact status line
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 48
set -g status-right-length 100
set -g status-style "bg=#111318,fg=#e3e2e9"
set -g status-left "#[bg=#b7c4ff,fg=#14265c,bold] #S #[default]"
set -g status-right "#[fg=#c7c5d0] #{b:pane_current_path}  #[fg=#b7c4ff,bold]%H:%M "

# Windows and panes
setw -g mode-keys vi
set -g status-keys vi
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action any
set -g pane-border-lines simple

# Splits and navigation keep the current working directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r L resize-pane -R 5

# Wayland clipboard and vi-like selection.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key P run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer -d"

# Built-in workspace tools; no plugin manager required.
bind-key s choose-tree -Zw
bind-key T display-popup -E -d "#{pane_current_path}" -w 90% -h 85% "$SHELL"
bind-key r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux configuration reloaded"

# Load the current ML4W palette, then refresh it asynchronously.
source-file -q "~/.config/tmux/theme.conf"
run-shell -b "~/.local/bin/tmux-ml4w-theme --apply"
